name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The conformance suite commit this SDK targets (suite 1.8). Moving to a newer
  # suite is a reviewed change to this one line.
  CONFORMANCE_REF: 9064df799e3c26e62460fcd8014d08d66a28007a

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out the conformance suite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Bynn-Intelligence/decision-node-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          token: ${{ secrets.DECISIONNODE_CONFORMANCE_TOKEN }}
          path: conformance
          persist-credentials: false

      - name: Python for the mock server
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Starts the suite's mock server on a free port and runs every case of every kind.
      - name: Run the conformance suite
        env:
          DECISIONNODE_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: npm run test:conformance

  runtimes:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out the conformance suite
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: Bynn-Intelligence/decision-node-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          token: ${{ secrets.DECISIONNODE_CONFORMANCE_TOKEN }}
          path: conformance
          persist-credentials: false

      - name: Python for the mock server
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Smoke test against the mock server
        env:
          DECISIONNODE_CONFORMANCE_DIR: ${{ github.workspace }}/conformance
        run: |
          python3 "$DECISIONNODE_CONFORMANCE_DIR/mock/server.py" --port 0 > mock.out &
          for _ in $(seq 50); do grep -q '^listening on ' mock.out && break; sleep 0.1; done
          export DECISIONNODE_BASE_URL="$(sed -n 's/^listening on //p' mock.out | head -1)"
          if [ "${{ matrix.runtime }}" = deno ]; then
            deno run --allow-env --allow-net --allow-read test/runtime/smoke.mjs
          else
            bun test/runtime/smoke.mjs
          fi
