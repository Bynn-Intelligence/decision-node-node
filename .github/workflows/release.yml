# Release: builds the npm package on every push to main as a dry run, and publishes it
# from a v* tag. The publish job uploads the dry run's own tarball; nothing is rebuilt.
#
# What has to exist before the first tag (none of it is created here):
#
# - npm: the scope @bynn (an npm organization). The package @bynn/decisionnode is created
#   by its first publish.
# - GitHub environment "release" on Bynn-Intelligence/decision-node-node, with required
#   reviewers (the people who approve a publish) and deployment limited to tags matching
#   v*. The publish job runs in it and waits for a reviewer.
# - Secret NPM_BOOTSTRAP_TOKEN, optional, in the environment "release": an npm granular
#   access token with read and write (publish) permission on the @bynn scope. npm can only
#   attach a trusted publisher to a package that already exists, so the first publish uses
#   this token. Delete the secret, and revoke the token, right after the first publish.
# - npm trusted publisher, added after the first publish on npmjs.com, package
#   @bynn/decisionnode, Settings, Trusted publishing: publisher GitHub Actions,
#   organization or user Bynn-Intelligence, repository decision-node-node, workflow
#   filename release.yml, environment name release, allowed to run npm publish. Every
#   later publish authenticates with the job's OIDC token and no stored secret.
# - The repository must be public when a tag is published: npm attaches provenance only
#   for a public repository.
#
# A release: set the version in package.json and src/version.ts, give the CHANGELOG
# section of that version its date, push to main, check that this workflow's dry run is
# green there, then push the tag v<version> on that commit.

name: release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  dry-run:
    name: Build and check the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: npm ci

      - run: npm run build

      - name: Pack the tarball to publish
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          file="$(npm pack --pack-destination out --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "packed out/$file"

      - name: Check the tarball
        shell: bash
        env:
          FILE: out/${{ steps.pack.outputs.file }}
          # Names that must never ship in the package, base64 so the list itself stays
          # out of the repository's text. Decoded, it is a case-insensitive regular
          # expression.
          DENYLIST_B64: 
        run: |
          set -euo pipefail
          echo "Files in $FILE:"
          tar -tzf "$FILE" | sort | tee files.txt
          # Only the package's own files: no tests, fixtures, scripts, CI files or
          # scratch files.
          if grep -vE '^package/(package\.json|README\.md|LICENSE|CHANGELOG\.md|dist/[A-Za-z0-9._-]+\.(js|cjs|mjs|d\.ts|d\.cts|d\.mts|js\.map|cjs\.map|mjs\.map))$' files.txt; then
            echo "::error::the files above are outside the package's allowlist"
            exit 1
          fi
          if grep -iE '^package/dist/.*(test|spec|fixture)' files.txt; then
            echo "::error::test files in the package"
            exit 1
          fi
          rm -rf unpacked && mkdir unpacked && tar -xzf "$FILE" -C unpacked
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="$(sed -nE 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+[^] ]*)\]?( .*)?$/\1/p' unpacked/package/CHANGELOG.md | head -n 1)"
          fi
          EXPECTED="$expected" node - <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const fail = (msg) => { console.error(`::error::${msg}`); process.exitCode = 1; };
          const root = 'unpacked/package';
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          const expected = process.env.EXPECTED;
          if (pkg.name !== '@bynn/decisionnode') fail(`name is ${pkg.name}, not @bynn/decisionnode`);
          if (!expected) fail('no version to compare with: no tag and no CHANGELOG entry');
          else if (pkg.version !== expected) fail(`version ${pkg.version} is not ${expected}`);
          if (pkg.license !== 'MIT') fail(`license is ${pkg.license}, not MIT`);
          const repo = typeof pkg.repository === 'string' ? pkg.repository : pkg.repository && pkg.repository.url;
          if (repo !== 'git+https://github.com/Bynn-Intelligence/decision-node-node.git') fail(`repository is ${repo}`);
          const readme = path.join(root, 'README.md');
          if (!fs.existsSync(readme) || fs.statSync(readme).size === 0) fail('README.md is missing or empty');
          const changelog = fs.readFileSync(path.join(root, 'CHANGELOG.md'), 'utf8');
          const heading = new RegExp(`^## \\[?${expected.replace(/\./g, '\\.')}\\]?( |$)`, 'm');
          if (expected && !heading.test(changelog)) fail(`CHANGELOG.md has no section for ${expected}`);
          // The boosters the package's page describes are the ones the API serves.
          const unserved = /face_detection|wanted_person/i;
          if (unserved.test(fs.readFileSync(readme, 'utf8'))) fail('README.md names a booster the API does not serve');
          if (unserved.test(pkg.description || '')) fail('the description names a booster the API does not serve');
          const deny = new RegExp(Buffer.from(process.env.DENYLIST_B64, 'base64').toString('utf8'), 'i');
          const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) =>
            e.isDirectory() ? walk(path.join(dir, e.name)) : [path.join(dir, e.name)]);
          for (const file of walk(root)) {
            const lines = fs.readFileSync(file, 'utf8').split('\n');
            lines.forEach((line, i) => {
              if (deny.test(line)) fail(`${path.relative(root, file)}:${i + 1} matches the denylist`);
            });
          }
          if (!process.exitCode) console.log(`${pkg.name}@${pkg.version} checked`);
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: out/${{ steps.pack.outputs.file }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: dry-run
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # The GitHub release.
      contents: write
      # npm trusted publishing and its provenance.
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a commit already on main is released: a tag pushed on any other
      # branch, or on a commit that never went through review, stops here.
      - name: Check that the tag is on main
        shell: bash
        run: |
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot check the tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $tagged, which is not on main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} ($tagged) is on main"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: out

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.21.0

      - name: Publish the dry run's tarball
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*.tgz)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected one tarball, found ${#files[@]}"
            exit 1
          fi
          if [ -n "${NPM_BOOTSTRAP_TOKEN}" ]; then
            # The first publish only: the package does not exist yet, so no trusted
            # publisher can be attached to it.
            npmrc="$RUNNER_TEMP/bootstrap.npmrc"
            umask 077
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_BOOTSTRAP_TOKEN}" > "$npmrc"
            NPM_CONFIG_USERCONFIG="$npmrc" npm publish "${files[0]}" --access public --provenance
            rm -f "$npmrc"
          else
            npm publish "${files[0]}" --access public
          fi

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" out/*.tgz --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
